[project]
name = "premiere-control-room-backend"
version = "0.1.0"
description = "FastAPI backend + ADK agent crew for Premiere Control Room"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "google-adk[mcp]>=2.0.0,<3",
    "google-genai>=1.0.0",
    "mcp>=1.24,<2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "pyjwt>=2.9.0",
    "google-cloud-firestore>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped: the Firestore AsyncClient (app/firestore_db.py) is a
# process-wide lru_cache singleton whose gRPC channel binds to whatever
# event loop is running when it's first constructed. A fresh per-test loop
# (pytest-asyncio's default) would leave that channel pointing at a closed
# loop on every test after the first, raising "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
